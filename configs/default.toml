# Active benchmark configuration. Historical Flickr30k manifests and artifacts
# remain preserved; the primary accessible benchmark is official COCO val2017.

[project]
name = "omnisearch"
schema_version = 1

[reproducibility]
seed = 42
deterministic = true
split_group = "image_id"
record_git_revision = true

[dataset]
id = "coco2017_val"
dataset_family = "MS COCO"
dataset_version = "2017-val-captions"
status = "official_images_and_captions_acquired_verified"
metadata_source_url = "http://images.cocodataset.org/annotations/annotations_trainval2017.zip"
official_data_page = "https://cocodataset.org/dataset/download.htm"
terms_url = "https://cocodataset.org/dataset/termsofuse.htm"
image_archive_url = "http://images.cocodataset.org/zips/val2017.zip"
image_root = "data/raw/coco2017/val2017"
caption_annotation_path = "data/raw/coco2017/annotations/captions_val2017.json"
split_protocol = "deterministic_sha256_image_group_split_seed_42"
download_policy = "explicit_only"
caption_relevance = "all_captions_for_image_are_relevant"
tier1_image_records = 100
tier2_image_records = 1000
tier3_image_records = 5000
historical_dataset = "flickr30k"

[compute]
device = "auto"
batch_size = 16
num_workers = 0
mixed_precision = false
max_image_size = 224

[paths]
data_root = "data"
raw_dir = "data/raw"
interim_dir = "data/interim"
processed_dir = "data/processed"
artifact_dir = "artifacts"
experiment_dir = "artifacts/experiments"
metric_dir = "artifacts/metrics"
model_dir = "artifacts/models"
log_dir = "artifacts/logs"

[eda]
short_caption_words = 3
long_caption_words = 30
small_image_dimension = 64
large_file_bytes = 10000000
sample_size = 12
near_duplicate_status = "not_evaluated_no_perceptual_hash"

[phase3]
text_split = "test"
max_text_queries = 256
top_k = 10
tfidf_ngram_min = 1
tfidf_ngram_max = 1
tfidf_min_df = 1
tfidf_max_df = 1.0
tfidf_sublinear_tf = true
bm25_k1 = 1.5
bm25_b = 0.75
image_bins = 8
image_grid_size = 2
image_query_limit = 64

[phase4]
model_id = "openai/clip-vit-base-patch32"
device = "auto"
batch_size = 8
text_max_length = 77
text_max_items = 256
image_max_items = 1000
cache_enabled = true

[phase6]
phase5_artifact_dir = "artifacts/coco/phase5"
device = "auto"
batch_size = 8
split = "test"
text_max_queries = 256
top_k = 10
bootstrap_resamples = 200
text_models = ["minilm_mean", "distilbert_mean"]
vision_models = ["resnet18_native", "vit_base_native"]
run_clip_components = true

[phase7]
manifest = "data/processed/coco2017_val_split_manifest.json"
image_root = "data/raw/coco2017/val2017"
model_id = "openai/clip-vit-base-patch32"
device = "auto"
batch_size = 2
gradient_accumulation_steps = 4
num_workers = 0
epochs = 1
learning_rate = 1e-6
weight_decay = 0.01
warmup_steps = 0
max_grad_norm = 1.0
text_max_length = 77
precision = "fp32"
selection_metric = "mean_recall_at_5"
early_stopping_patience = 2
bootstrap_resamples = 200
max_train_images = 800
max_validation_images = 100
max_test_images = 100

